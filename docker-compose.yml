services:
  # Redis: the database. --appendonly yes writes every change to a file
  # (appendonly.aof) inside /data, and /data is a named volume, so the data
  # survives `docker compose down` / `up` and container crashes.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # API: receives plates from the camera (POST) and serves the dashboard (GET).
  # No published port: only reachable inside the Compose network (via Nginx).
  api:
    build: ./api
    image: smart-parking-api
    environment:
      REDIS_URL: redis://redis:6379
      CAPACITY: ${CAPACITY:-10}
      PRICE_PER_HOUR: ${PRICE_PER_HOUR:-12}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Web: Nginx serves the dashboard and proxies /api/* to the api service.
  web:
    build: ./web
    image: smart-parking-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional fake IoT camera (camera/): POSTs a random plate every 10 seconds.
  # Only starts with:  docker compose --profile camera up
  camera:
    build: ./camera
    image: smart-parking-camera
    profiles: ["camera"]
    environment:
      API_URL: http://api:3000/api/cars
      INTERVAL: 10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
